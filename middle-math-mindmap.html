<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>初中数学知识点框架图 · 思维导图</title>
<style id="page-style">
  :root{
    --board:#1B3A2F;
    --board-dark:#142B23;
    --paper:#FBF7EC;
    --paper-line:#E7DEC7;
    --ink:#22301F;
    --ink-soft:#5B6B54;
    --chalk-yellow:#E8C468;
    --chalk-white:#F4F1E6;
    font-family:"Noto Serif SC","Songti SC","STSong",serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--board);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.03), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(255,255,255,0.03), transparent 60%);
    color:var(--chalk-white);
    min-height:100vh;
  }
  header{
    padding:28px 24px 10px;
    text-align:center;
    border-bottom:1px dashed rgba(244,241,230,0.25);
  }
  header h1{
    margin:0 0 4px;
    font-size:26px;
    letter-spacing:6px;
    font-weight:700;
    color:var(--chalk-white);
    text-shadow:0 0 1px rgba(244,241,230,0.4);
  }
  header p{
    margin:0;
    font-size:12px;
    letter-spacing:2px;
    color:rgba(244,241,230,0.55);
    font-family:ui-monospace,Menlo,monospace;
  }

  nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:18px 16px 4px;
  }
  nav button{
    appearance:none;
    border:1px solid rgba(244,241,230,0.35);
    background:transparent;
    color:rgba(244,241,230,0.8);
    padding:8px 16px;
    border-radius:999px;
    font-size:13px;
    letter-spacing:2px;
    cursor:pointer;
    font-family:inherit;
    transition:all .15s ease;
  }
  nav button:hover{
    border-color:var(--chalk-yellow);
    color:var(--chalk-yellow);
  }
  nav button.active{
    background:var(--chalk-yellow);
    border-color:var(--chalk-yellow);
    color:var(--board-dark);
    font-weight:700;
  }

  main{
    max-width:1180px;
    margin:18px auto 60px;
    padding:0 16px;
  }

  .panel{
    display:none;
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .panel.active{display:block;}

  .panel-head{
    padding:20px 26px 14px;
    border-bottom:2px solid var(--accent, #C9532F);
    display:flex;
    align-items:baseline;
    gap:12px;
    background:
      repeating-linear-gradient( var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px );
  }
  .panel-head .tag{
    font-family:ui-monospace,Menlo,monospace;
    font-size:12px;
    color:#fff;
    background:var(--accent,#C9532F);
    padding:3px 10px;
    border-radius:4px;
    letter-spacing:1px;
  }
  .panel-head h2{
    margin:0;
    font-size:20px;
    letter-spacing:1px;
  }
  .panel-toolbar{
    margin-left:auto;
    display:flex;
    gap:8px;
  }
  .panel-toolbar button{
    font-family:ui-monospace,Menlo,monospace;
    font-size:11px;
    border:1px solid var(--ink-soft);
    background:transparent;
    color:var(--ink-soft);
    padding:4px 9px;
    border-radius:6px;
    cursor:pointer;
  }
  .panel-toolbar button:hover{
    border-color:var(--accent,#C9532F);
    color:var(--accent,#C9532F);
  }

  .mindmap{
    padding:20px 26px 34px;
    background:
      repeating-linear-gradient( var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px );
    font-size:14.5px;
    line-height:1.55;
  }

  ul.tree{
    list-style:none;
    margin:0;
    padding-left:22px;
    border-left:1.5px dashed #C9B98A;
  }
  .mindmap > ul.tree{
    border-left:none;
    padding-left:0;
  }
  ul.tree li{
    position:relative;
    margin:3px 0;
    padding-left:16px;
  }
  ul.tree li::before{
    content:"";
    position:absolute;
    left:0;
    top:14px;
    width:14px;
    height:1.5px;
    background:#C9B98A;
  }
  .node{
    display:inline-flex;
    align-items:flex-start;
    gap:6px;
    cursor:default;
  }
  .node .twist{
    flex:0 0 auto;
    width:14px;
    height:14px;
    margin-top:2px;
    border-radius:3px;
    border:1px solid var(--accent,#C9532F);
    color:var(--accent,#C9532F);
    font-size:10px;
    line-height:12px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    background:#fff;
  }
  .node .twist.leaf{
    visibility:hidden;
  }
  .node .label{
    color:var(--ink);
  }
  .lvl-0 > .node .label{
    font-weight:700;
    font-size:17px;
    color:var(--accent,#C9532F);
  }
  .lvl-1 > .node .label{
    font-weight:700;
    color:#3A4A32;
  }
  .lvl-2 > .node .label{
    color:var(--ink);
  }
  .lvl-3 > .node .label, .lvl-4 > .node .label{
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .formula{
    font-family:ui-monospace,"Cambria Math",monospace;
  }
  ul.tree.collapsed{
    display:none;
  }

  footer{
    text-align:center;
    color:rgba(244,241,230,0.4);
    font-size:11px;
    padding:0 0 30px;
    font-family:ui-monospace,Menlo,monospace;
    letter-spacing:1px;
  }
</style>
</head>

/* ---------- 渲染逻辑 ---------- */

function renderNode(node, level){
  const li = document.createElement("li");
  li.className = "lvl-" + level;

  const wrap = document.createElement("div");
  wrap.className = "node";

  const twist = document.createElement("span");
  twist.className = "twist" + (node.children && node.children.length ? "" : " leaf");
  twist.textContent = node.children && node.children.length ? "–" : "";

  const label = document.createElement("span");
  label.className = "label" + (node.f ? " formula" : "");
  label.textContent = node.label;

  wrap.appendChild(twist);
  wrap.appendChild(label);
  li.appendChild(wrap);

  if(node.children && node.children.length){
    const ul = document.createElement("ul");
    ul.className = "tree";
    node.children.forEach(child => ul.appendChild(renderNode(child, level+1)));
    li.appendChild(ul);

    twist.addEventListener("click", () => {
      const collapsed = ul.classList.toggle("collapsed");
      twist.textContent = collapsed ? "+" : "–";
    });
  }

  return li;
}

function buildPanel(part){
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.id = "panel-" + part.id;
  panel.style.setProperty("--accent", part.accent);

  const head = document.createElement("div");
  head.className = "panel-head";
  head.innerHTML = `<span class="tag">${part.short}</span><h2>${part.title}</h2>`;

  const toolbar = document.createElement("div");
  toolbar.className = "panel-toolbar";
  const expandBtn = document.createElement("button");
  expandBtn.textContent = "全部展开";
  const collapseBtn = document.createElement("button");
  collapseBtn.textContent = "全部折叠";
  const svgBtn = document.createElement("button");
  svgBtn.textContent = "下载 SVG";
  toolbar.appendChild(expandBtn);
  toolbar.appendChild(collapseBtn);
  toolbar.appendChild(svgBtn);
  head.appendChild(toolbar);

  const body = document.createElement("div");
  body.className = "mindmap";
  const rootUl = document.createElement("ul");
  rootUl.className = "tree";
  rootUl.appendChild(renderNode(part.data, 0));
  body.appendChild(rootUl);

  expandBtn.addEventListener("click", () => {
    body.querySelectorAll("ul.tree.collapsed").forEach(u => u.classList.remove("collapsed"));
    body.querySelectorAll(".twist:not(.leaf)").forEach(t => t.textContent = "–");
  });
  collapseBtn.addEventListener("click", () => {
    body.querySelectorAll(".mindmap > ul.tree > li > ul.tree").forEach(u => {}); // no-op guard
    body.querySelectorAll("ul.tree").forEach(u => {
      if(u !== rootUl) u.classList.add("collapsed");
    });
    body.querySelectorAll(".twist:not(.leaf)").forEach(t => t.textContent = "+");
  });

  svgBtn.addEventListener("click", () => exportSVG(part, body));

  panel.appendChild(head);
  panel.appendChild(body);
  return panel;
}

/* ---------- 导出为 SVG ---------- */

function exportSVG(part, mindmapEl){
  const width  = Math.max(mindmapEl.scrollWidth, mindmapEl.clientWidth) + 20;
  const height = Math.max(mindmapEl.scrollHeight, mindmapEl.clientHeight) + 20;

  const styleText = document.getElementById("page-style").textContent;
  const clone = mindmapEl.cloneNode(true);
  clone.style.width = width + "px";

  const xhtmlDiv =
    '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + width + 'px;box-sizing:border-box;">' +
      '<style>' + styleText + '</style>' +
      clone.outerHTML +
    '</div>';

  const svgMarkup =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '" ' +
    'viewBox="0 0 ' + width + ' ' + height + '">' +
      '<rect x="0" y="0" width="' + width + '" height="' + height + '" fill="#FBF7EC"/>' +
      '<foreignObject x="0" y="0" width="' + width + '" height="' + height + '">' +
        xhtmlDiv +
      '</foreignObject>' +
    '</svg>';

  const blob = new Blob([svgMarkup], {type:"image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = part.short + "_" + part.title + "_思维导图.svg";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

const tabsEl = document.getElementById("tabs");
const panelsEl = document.getElementById("panels");

PARTS.forEach((part, i) => {
  const btn = document.createElement("button");
  btn.textContent = part.short + "·" + part.title;
  btn.addEventListener("click", () => activate(part.id));
  tabsEl.appendChild(btn);
  part._tabBtn = btn;

  const panel = buildPanel(part);
  panelsEl.appendChild(panel);
});

function activate(id){
  PARTS.forEach(p => {
    const isActive = p.id === id;
    p._tabBtn.classList.toggle("active", isActive);
    document.getElementById("panel-" + p.id).classList.toggle("active", isActive);
  });
}
activate(PARTS[0].id);
