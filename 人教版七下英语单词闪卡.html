                function resetToSideA() {
                    if (isFlipped) {
                        // 暂时关闭动画，瞬间切回A面
                        flashcard.style.transition = 'none';
                        flashcard.classList.remove('is-flipped');
                        isFlipped = false;

                        // 强制浏览器重绘 (Reflow)
                        void flashcard.offsetWidth;

                        // 恢复动画
                        flashcard.style.transition = 'transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1)';
                    }
                }

                function updateCard() {
                    if (vocabulary.length === 0) return;

                    var currentWord = vocabulary[currentIndex];

                    sideAChinese.innerText = currentWord.meaning;
                    sideAEnglish.innerText = currentWord.exp;
                    sideBWord.innerText = currentWord.word;

                    progress.innerText = (currentIndex + 1) + " / " + vocabulary.length;

                    resetToSideA();
                }

                window.flipCard = function () {
                    isFlipped = !isFlipped;
                    if (isFlipped) {
                        flashcard.classList.add('is-flipped');
                    } else {
                        flashcard.classList.remove('is-flipped');
                    }
                };

                window.prevCard = function () {
                    if (currentIndex > 0) {
                        currentIndex--;
                        updateCard();
                    }
                };

                window.nextCard = function () {
                    if (currentIndex < vocabulary.length - 1) {
                        currentIndex++;
                        updateCard();
                    }
                };

                window.shuffleCards = function () {
                    for (var i = vocabulary.length - 1; i > 0; i--) {
                        var j = Math.floor(Math.random() * (i + 1));
                        var temp = vocabulary[i];
                        vocabulary[i] = vocabulary[j];
                        vocabulary[j] = temp;
                    }
                    currentIndex = 0;
                    updateCard();
                };

                document.addEventListener('keydown', function (e) {
                    if (e.code === 'ArrowRight') {
                        nextCard();
                    } else if (e.code === 'ArrowLeft') {
                        prevCard();
                    } else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
                        e.preventDefault();
                        flipCard();
                    }
                });

                updateCard();
            };
        </script>
    </body>

</html>
